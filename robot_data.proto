syntax = "proto3";

package physical_robot;

// Messages
message LidarData {
    repeated float angles = 1;
    repeated float dists = 2;
    int64 timestamp = 3;
}

message Acknowledge {
    bool success = 1;
    string message = 2;
}

message MotionCommand {
    string motion_type = 1;
    float distance = 2;
}

message MotionDistance {
    float left_wheel_dist = 1;
    float right_wheel_dist = 2;
}

message Image {
    bytes img_bytes = 1;
    repeated int64 shape = 2;
    string type = 3;
}

message CameraData {
    Image rgb_img = 1;
    Image depth_img = 2;
    int64 timestamp = 3;
}

// message OakdData {
//     optional Image rgb_img = 1;
//     optional Image depth_img = 2;
//     // optional float accelerometer = 3;
//     // optional float gyroscope = 4;
// }

// Services
service RobotServer {
    rpc GetLatestLidarData(Acknowledge) returns (LidarData);

    rpc GetLatestImageData(Acknowledge) returns (CameraData);

    rpc SendMotionCommand(MotionCommand) returns (MotionDistance);
}